<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Window Smash</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>
  <div class="hud">
    <div class="tag"><small id="lvlNo">1/3</small><span id="lvlName">Test Pane</span></div>
    <div id="balls"></div>
    <div class="spacer"></div>
    <button id="gear" aria-label="Tuning">⚙</button>
  </div>
  <div id="panel" hidden>
    <h4>Tuning</h4>
    <div class="row" id="modeRow" hidden>
      <button class="chip" data-mode="aim">Swipe to aim</button>
      <button class="chip" data-mode="shape">Swipe shape</button>
    </div>
    <div id="sliders" style="display:grid;gap:7px"></div>
    <div class="row">
      <button class="chip" data-lvl="0">Level 1</button>
      <button class="chip" data-lvl="1">Level 2</button>
      <button class="chip" data-lvl="2">Level 3</button>
      <button class="chip" id="sandbox">Sandbox</button>
    </div>
    <div class="row">
      <button class="chip" id="sound">Sound on</button>
      <button class="chip" id="copy">Copy values</button>
      <button class="chip" id="reset">Defaults</button>
    </div>
    <textarea id="copyBox" hidden readonly aria-label="Tuning values"></textarea>
  </div>
  <div id="bubble" hidden>HEY!!</div>
  <div id="toast" hidden></div>
  <div id="hint" hidden></div>
  <div id="hintText" hidden>Swipe up from the ball</div>
  <div id="card" hidden>
    <h2 id="cardTitle">Smashed!</h2>
    <div id="stars"></div>
    <p id="cardText"></p>
    <button id="next">Next</button>
  </div>
</div>

<script src="js/lib/three.min.js"></script>
<script src="js/settings.js"></script>
<script src="js/scene.js"></script>
<script src="js/ball.js"></script>
<script src="js/fx.js"></script>
<script src="js/audio.js"></script>
<script src="js/levels.js"></script>
<script src="js/input.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
