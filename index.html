<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Window Smash</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="fb" viewBox="-26 -26 52 52"><clipPath id="fbClip"><circle r="24"/></clipPath><circle r="24" fill="#faf9f3"/><g clip-path="url(#fbClip)" fill="#1f2634"><polygon points="0,-7.5 7.1,-2.3 4.4,6.1 -4.4,6.1 -7.1,-2.3"/><polygon points="0,-13 -7.1,-18.2 -4.4,-26.6 4.4,-26.6 7.1,-18.2"/><polygon points="12.4,-4 15.1,-12.4 23.9,-12.4 26.6,-4 19.5,1.2"/><polygon points="7.6,10.5 16.5,10.5 19.2,18.9 12,24.1 4.9,18.9"/><polygon points="-7.6,10.5 -4.9,18.9 -12,24.1 -19.2,18.9 -16.5,10.5"/><polygon points="-12.4,-4 -19.5,1.2 -26.6,-4 -23.9,-12.4 -15.1,-12.4"/></g><circle r="24" fill="none" stroke="#23304a" stroke-width="3"/></symbol></svg>


<div id="stage">
  <div id="loader" role="status" aria-label="Loading">
    <svg class="ld-pic" viewBox="0 0 160 128" width="160" height="128" aria-hidden="true">
      <rect x="6" y="6" width="148" height="116" rx="3" fill="#bfe9ff"/>
      <path d="M6 70 L62 6 H84 L6 96Z M6 116 L100 6 H108 L6 122Z" fill="#fff" opacity=".55"/>
      <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
        <path d="M80 64 L58 44 L44 40 L12 14"/><path d="M80 64 L104 38 L118 34 L150 10"/><path d="M80 64 L118 70 L150 78"/>
        <path d="M80 64 L98 94 L104 122"/><path d="M80 64 L60 92 L48 122"/><path d="M80 64 L44 70 L10 66"/><path d="M80 64 L84 30 L78 6"/>
        <path d="M58 44 L62 30 M104 38 L112 52 M118 70 L126 92 M98 94 L120 100 M60 92 L36 100 M44 70 L36 48" stroke-width="1.6"/>
        <path d="M80 30 Q106 34 112 56 Q118 84 96 94 Q72 104 56 88 Q42 70 54 46 Q64 32 80 30" stroke-width="1.8"/>
      </g>
      <rect x="6" y="6" width="148" height="116" rx="3" fill="none" stroke="#fff8e8" stroke-width="9"/>
      <g transform="translate(80 64)">
        <clipPath id="ldClip"><circle r="24"/></clipPath>
        <circle r="24" fill="#faf9f3"/>
        <g clip-path="url(#ldClip)" fill="#1f2634"><polygon points="0.0,-7.5 7.1,-2.3 4.4,6.1 -4.4,6.1 -7.1,-2.3"/><polygon points="0.0,-13.0 -7.1,-18.2 -4.4,-26.6 4.4,-26.6 7.1,-18.2"/><polygon points="12.4,-4.0 15.1,-12.4 23.9,-12.4 26.6,-4.0 19.5,1.2"/><polygon points="7.6,10.5 16.5,10.5 19.2,18.9 12.0,24.1 4.9,18.9"/><polygon points="-7.6,10.5 -4.9,18.9 -12.0,24.1 -19.2,18.9 -16.5,10.5"/><polygon points="-12.4,-4.0 -19.5,1.2 -26.6,-4.0 -23.9,-12.4 -15.1,-12.4"/><g stroke="#78808c" stroke-width="1.4"><line x1="0.0" y1="-7.5" x2="0.0" y2="-13.0"/><line x1="7.1" y1="-2.3" x2="12.4" y2="-4.0"/><line x1="4.4" y1="6.1" x2="7.6" y2="10.5"/><line x1="-4.4" y1="6.1" x2="-7.6" y2="10.5"/><line x1="-7.1" y1="-2.3" x2="-12.4" y2="-4.0"/></g></g>
        <circle r="24" fill="none" stroke="#23304a" stroke-width="2.4"/>
        <ellipse cx="-8" cy="-10" rx="7" ry="4" fill="#fff" opacity=".7" transform="rotate(-35 -8 -10)"/>
      </g>
    </svg>
    <div class="ld-bar"><b></b></div>
    <div class="ld-pct">0%</div>
    <script>/* loading 0–100%: eases toward 85% while files download (at least 60% once three.js is in), then 100% when the game is ready (ui.js sets ldDone) */
    (function(){var b=document.querySelector('.ld-bar b'),t=document.querySelector('.ld-pct'),p=0,t0=performance.now();
    function f(){var s=(performance.now()-t0)/1000,g=window.ldDone?100:Math.max(85*(1-Math.exp(-s*1.6)),window.THREE?60:0);
    p+=(g-p)*(window.ldDone?.3:.12);if(g-p<.5)p=g;b.style.width=p+'%';t.textContent=Math.floor(p)+'%';
    if(p<100)requestAnimationFrame(f);else window.ldFull=1}requestAnimationFrame(f)})();</script>
  </div>
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>
  <div id="fail" hidden><div id="missed"></div><div class="failBox"><h2>Out of balls</h2><p id="failLeft"></p><b>Tap to retry</b></div></div>
  <div class="hud">
    <div id="balls"></div>
    <div class="spacer"></div>
    <button id="retryBtn" class="ib" aria-label="Restart level" title="Restart level"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.05-4.95" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/><path d="M19.5 3.5v5h-5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="skipBtn" class="ib" aria-label="Skip level" title="Skip level"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5v13l9-6.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M18 5.5v13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
    <button id="soundBtn" class="ib" aria-label="Sound on" title="Sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><g class="on"><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></g><g class="off"><path d="M15.5 9.5l5 5M20.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></g></svg></button>
  </div>
  <div id="lvlNo">Level 1</div>
  <button id="gear" aria-label="Tuning (dev)">⚙</button>
  <div id="panel" hidden>
    <h4>Tuning</h4>
    <div class="row" id="modeRow">
      <button class="chip" data-mode="live">Live swipe</button>
      <button class="chip" data-mode="livep">Live+</button>
      <button class="chip" data-mode="lives">Live+ Strong</button>
      <button class="chip" data-mode="aim">Swipe to aim</button>
      <button class="chip" data-mode="shape">Swipe shape</button>
    </div>
    <div class="row" id="glassRow">
      <button class="chip" id="glSky">Glass: sky drift</button>
      <button class="chip" id="glGlint">Glass: glints</button>
    </div>
    <div id="sliders" style="display:grid;gap:7px"></div>
    <div class="row" id="lvlRow"></div>
    <div class="row"><button class="chip" id="sandbox">Sandbox</button></div>
    <div class="row">
      <button class="chip" id="copy">Copy values</button>
      <button class="chip" id="reset">Defaults</button>
    </div>
    <textarea id="copyBox" hidden readonly aria-label="Tuning values"></textarea>
  </div>
  <div id="bubble" hidden>@#$%!</div>
  <svg id="hintArr" hidden height="56" aria-hidden="true"><polygon fill="#fff" stroke="#23304a" stroke-width="3" stroke-linejoin="round"/></svg>
  <div id="hint" hidden><svg viewBox="0 0 72 78" width="72" height="78" aria-hidden="true"><g transform="translate(12 8) rotate(-30)" fill="#fff" stroke="#23304a" stroke-width="3.5" stroke-linejoin="round"><rect x="6" y="18" width="8.5" height="20" rx="4.2"/><rect x="14.5" y="20" width="8" height="20" rx="4"/><rect x="22.5" y="23" width="7.5" height="19" rx="3.7"/><rect x="-6.5" y="0" width="13" height="38" rx="6.5"/><path d="M-9 35q0-6 6-6h27q7 0 7 7v14q0 16-19 16q-21 0-21-17z"/><ellipse cx="-8" cy="45" rx="6" ry="11.5" transform="rotate(22 -8 45)"/><path d="M-2.5 22h5" fill="none" stroke-width="2.5" stroke-linecap="round"/></g></svg></div>
  <div id="win" hidden><h2 id="winWord">SMASHED!</h2><button id="again" hidden>Play again</button></div>
  <div id="wipe"></div>
</div>

<script src="js/lib/three.min.js"></script>
<script src="js/settings.js"></script>
<script src="js/scene.js"></script>
<script src="js/ball.js"></script>
<script src="js/fx.js"></script>
<script src="js/audio.js"></script>
<script src="js/levels.js"></script>
<script src="js/mech.js"></script>
<script src="js/glare.js"></script>
<script src="js/input.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
