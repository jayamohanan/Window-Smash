<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Window Smash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap">
<style>
/* Layout: one full-bleed 3D yard; thin HUD along the top; cards float over the lawn. Single look, so no dark theme. */
:root{
  --ink:#23304a; --paper:#fff8e8; --glass:#bfe9ff; --brick:#d9503f; --gold:#ffc53a; --lawn:#5da845;
  --display:"Lilita One","Trebuchet MS",sans-serif; --body:"Nunito","Trebuchet MS",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#8fd0ee;font-family:var(--body);color:var(--ink);-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;overflow:hidden}
#gl,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{touch-action:none;cursor:crosshair}
#fx{pointer-events:none}
.hud{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;pointer-events:none}
.tag{background:var(--ink);color:var(--paper);font-family:var(--display);font-size:17px;padding:7px 13px;border-radius:10px;white-space:nowrap}
.tag small{font-family:var(--body);font-weight:900;font-size:12px;color:var(--glass);margin-right:7px}
#balls{display:flex;gap:4px;align-items:center;background:rgba(35,48,74,.85);padding:7px 10px;border-radius:10px}
#balls i{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#23304a 0 28%,#fff 30%);box-shadow:inset 0 0 0 1px #9aa7bd;display:block}
#balls i.used{opacity:.22}
.spacer{flex:1}
#gear{pointer-events:auto;width:40px;height:40px;border:0;border-radius:10px;background:var(--ink);color:var(--paper);font-size:20px;cursor:pointer}
#gear:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#panel{position:absolute;top:calc(60px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:min(290px,calc(100vw - 24px));max-height:calc(100% - 80px);overflow:auto;background:var(--paper);border-radius:12px;padding:12px 14px;box-shadow:0 8px 0 rgba(35,48,74,.25);font-size:13px;display:grid;gap:8px}
#panel h4{margin:0;font-family:var(--display);font-weight:400;font-size:16px}
#panel label{display:grid;grid-template-columns:1fr 44px;gap:0 6px;font-weight:700;align-items:center}
#panel label input{grid-column:1/3;width:100%;accent-color:var(--brick)}
#panel output{text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;gap:6px;flex-wrap:wrap}
.chip{flex:1;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;padding:5px 6px;font:900 12px var(--body);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--paper)}
#copyBox{width:100%;box-sizing:border-box;height:58px;font:11px monospace}
.pop{position:absolute;font-family:var(--display);color:#fff;font-size:clamp(38px,8vw,84px);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);pointer-events:none;transform:translate(-50%,-50%);animation:pop .95s cubic-bezier(.2,1.5,.4,1) forwards;white-space:nowrap}
.pop.small{font-size:clamp(24px,4.6vw,46px);color:var(--gold);-webkit-text-stroke:2px var(--ink);text-shadow:0 3px 0 var(--ink)}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2) rotate(-14deg);opacity:0}16%{transform:translate(-50%,-50%) scale(1.15) rotate(-6deg);opacity:1}70%{transform:translate(-50%,-70%) scale(1) rotate(-5deg);opacity:1}100%{transform:translate(-50%,-105%) scale(.92) rotate(-5deg);opacity:0}}
#bubble{position:absolute;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:6px 14px;font-family:var(--display);font-size:clamp(22px,4vw,38px);color:var(--brick);transform:translate(-50%,-100%);pointer-events:none}
#bubble::after{content:"";position:absolute;left:50%;bottom:-13px;margin-left:-8px;border:8px solid transparent;border-top:12px solid var(--ink);border-bottom:0}
#card{position:absolute;left:50%;bottom:calc(12% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);border-radius:16px;padding:16px 26px;text-align:center;box-shadow:0 8px 0 rgba(35,48,74,.3);animation:rise .28s cubic-bezier(.2,1.4,.4,1);width:min(300px,calc(100vw - 32px));box-sizing:border-box}
@keyframes rise{from{transform:translate(-50%,40px);opacity:0}}
#card h2{margin:0;font:400 28px var(--display);text-wrap:balance}
#stars{font-size:38px;line-height:1.15;letter-spacing:4px;color:#d9d0b8}
#stars b{color:var(--gold);font-weight:400;-webkit-text-stroke:1px #c8901a}
#card p{margin:0 0 10px;font-weight:700;font-size:14px}
#next{border:0;background:var(--brick);color:#fff;font:400 20px var(--display);padding:10px 26px;border-radius:10px;cursor:pointer;box-shadow:0 4px 0 #9d3226}
#toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(28px,6vw,54px);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;pointer-events:none;white-space:nowrap}
#hint{position:absolute;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:rgba(255,255,255,.9);border:3px solid var(--ink);pointer-events:none;animation:swipe 1.5s ease-in-out infinite}
@keyframes swipe{0%{transform:translate(var(--x0),var(--y0)) scale(1.1);opacity:0}15%{transform:translate(var(--x0),var(--y0)) scale(.85);opacity:1}72%{transform:translate(var(--x1),var(--y1)) scale(.85);opacity:1}100%{transform:translate(var(--x1),var(--y1)) scale(1.1);opacity:0}}
#hintText{position:absolute;left:50%;bottom:calc(25% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-family:var(--display);font-size:clamp(18px,3.4vw,26px);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;pointer-events:none;white-space:nowrap}
@media (prefers-reduced-motion:reduce){#hint{animation-duration:3s}}
</style>
</head>
<body>

<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>
  <div class="hud">
    <div class="tag"><small id="lvlNo">1/3</small><span id="lvlName">Test Pane</span></div>
    <div id="balls"></div>
    <div class="spacer"></div>
    <button id="gear" aria-label="Tuning">⚙</button>
  </div>
  <div id="panel" hidden>
    <h4>Tuning</h4>
    <div class="row" id="modeRow" hidden>
      <button class="chip" data-mode="aim">Swipe to aim</button>
      <button class="chip" data-mode="shape">Swipe shape</button>
    </div>
    <div id="sliders" style="display:grid;gap:7px"></div>
    <div class="row">
      <button class="chip" data-lvl="0">Level 1</button>
      <button class="chip" data-lvl="1">Level 2</button>
      <button class="chip" data-lvl="2">Level 3</button>
    </div>
    <div class="row">
      <button class="chip" id="sound">Sound on</button>
      <button class="chip" id="copy">Copy values</button>
      <button class="chip" id="reset">Defaults</button>
    </div>
    <textarea id="copyBox" hidden readonly aria-label="Tuning values"></textarea>
  </div>
  <div id="bubble" hidden>HEY!!</div>
  <div id="toast" hidden></div>
  <div id="hint" hidden></div>
  <div id="hintText" hidden>Swipe up from the ball</div>
  <div id="card" hidden>
    <h2 id="cardTitle">Smashed!</h2>
    <div id="stars"></div>
    <p id="cardText"></p>
    <button id="next">Next</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const T=THREE, $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.min(b,Math.max(a,v)), lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- settings ---------- */
const DEF={mode:'live',flight:13,side:1,lift:1,gravity:2.5,grab:1.5,ring:3,follow:14,speed:30,curve:1,snap:.2,preview:.4,freeze:85,slow:.3,shake:1,shards:1,sound:true};
const KEY='windowSmash.v2';
let S=Object.assign({},DEF);
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)S.shake=Math.min(S.shake,.2);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const SL=[['flight','Forward speed',6,30,.5,'live'],['side','Steering: sideways',.2,2,.05,'live'],['lift','Steering: height',.2,2,.05,'live'],['gravity','Gravity',0,10,.1,'live'],['grab','Grab circle (× ball)',1,3,.1,'live'],['ring','Kick ring (× ball)',1.5,6,.1,'live'],['follow','Ball follows drag',4,30,1,'live'],['speed','Ball speed',18,50,1,'old'],['curve','Curve strength',0,2,.05,'old'],['snap','Aim help',0,1,.05],['preview','Path preview',.1,1,.05,'old'],['freeze','Freeze on hit (ms)',0,200,5],['slow','Slow-mo speed',.1,1,.05],['shake','Screen shake',0,2,.1],['shards','Glass pieces',.4,2,.1]];

/* ---------- renderer and scene ---------- */
const canvas=$('gl'), fx=$('fx'), fctx=fx.getContext('2d');
const renderer=new T.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene(), camera=new T.PerspectiveCamera(46,1,.1,400);
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);return new T.CanvasTexture(c)}
scene.background=canvasTex(8,256,(g,w,h)=>{const a=g.createLinearGradient(0,0,0,h);a.addColorStop(0,'#3f9fdf');a.addColorStop(.55,'#9bd6ef');a.addColorStop(.75,'#ffe9bf');g.fillStyle=a;g.fillRect(0,0,w,h)});
scene.add(new T.HemisphereLight(0xffffff,0x93b56a,.72));
const sun=new T.DirectionalLight(0xfff1d6,.72); sun.position.set(-11,20,17); sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024); Object.assign(sun.shadow.camera,{left:-22,right:22,top:24,bottom:-16,near:1,far:70}); scene.add(sun);

const mats={};
const mat=c=>mats[c]||(mats[c]=new T.MeshLambertMaterial({color:c,flatShading:true}));
const bmats={};
const bmat=c=>bmats[c]||(bmats[c]=new T.MeshBasicMaterial({color:c}));
function box(w,h,d,c,x,y,z,p,shadow){const m=new T.Mesh(new T.BoxGeometry(w,h,d),typeof c==='number'?mat(c):c);m.position.set(x,y,z);if(shadow!==false){m.castShadow=true;m.receiveShadow=true}p.add(m);return m}

/* ---------- static yard ---------- */
const world=new T.Group(); scene.add(world);
(function yard(){
  const tex=canvasTex(256,256,(g,w,h)=>{for(let i=0;i<4;i++){g.fillStyle=i%2?'#6bb64f':'#62ac47';g.fillRect(i*w/4,0,w/4,h)}for(let i=0;i<1400;i++){g.fillStyle=Math.random()<.5?'rgba(255,255,190,.05)':'rgba(20,70,20,.06)';g.fillRect(Math.random()*w,Math.random()*h,2,5)}});
  tex.wrapS=tex.wrapT=T.RepeatWrapping; tex.repeat.set(16,16); tex.anisotropy=4;
  const ground=new T.Mesh(new T.PlaneGeometry(320,320),new T.MeshLambertMaterial({map:tex}));
  ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; world.add(ground);
  [[-70,-95,46,15,0x7fb86a],[20,-110,70,22,0x6fab60],[85,-90,44,13,0x86bf70],[-20,-130,90,30,0x8fbf86]].forEach(a=>{const m=new T.Mesh(new T.SphereGeometry(1,14,8),mat(a[4]));m.scale.set(a[2],a[3],30);m.position.set(a[0],0,a[1]);world.add(m)});
  const tree=(x,z,s,c)=>{const g=new T.Group();box(.55,3,.55,0x7a5532,0,1.5,0,g);[[0,3.8,0,2],[-.9,3.2,.3,1.35],[.9,3.3,-.2,1.45],[0,5,0,1.3]].forEach(l=>{const m=new T.Mesh(new T.IcosahedronGeometry(l[3],1),mat(c));m.position.set(l[0],l[1],l[2]);m.castShadow=true;g.add(m)});g.position.set(x,0,z);g.scale.setScalar(s);world.add(g)};
  [[-15,-5,1.5,0x4f9a45],[15.5,-6,1.65,0x459040],[-23,-14,2,0x5ba84e],[24,-15,2.1,0x4f9a45],[-9,-20,2.3,0x66ae55],[10,-24,2.5,0x5ba84e],[-32,-6,1.7,0x459040],[33,-5,1.6,0x66ae55]].forEach(a=>tree(...a));
  const n=70, geo=new T.BoxGeometry(.28,1.5,.1), pick=new T.InstancedMesh(geo,mat(0xfaf3e3),n), d=new T.Object3D();
  for(let i=0;i<n;i++){const s=i<n/2?-1:1,k=i<n/2?i:i-n/2;d.position.set(s*(8+k*.62),.75,-1.4);d.updateMatrix();pick.setMatrixAt(i,d.matrix)}pick.castShadow=true;world.add(pick);
  [-1,1].forEach(s=>[.5,1.1].forEach(y=>box(22,.12,.06,0xefe6d2,s*19,y,-1.48,world,false)));
})();
const clouds=[];
for(let i=0;i<6;i++){const g=new T.Group();for(let k=0;k<4;k++){const m=new T.Mesh(new T.IcosahedronGeometry(rnd(2.5,5),1),bmat(0xffffff));m.position.set(k*4-6,rnd(-1,1),rnd(-1,1));m.scale.y=.62;g.add(m)}g.position.set(rnd(-90,90),rnd(26,44),-110);g.userData.s=rnd(.5,1.2);clouds.push(g);scene.add(g)}

const spot=new T.Group();
(function(){const a=new T.Mesh(new T.CircleGeometry(1.15,28),new T.MeshLambertMaterial({color:0xa98e5c}));a.rotation.x=-Math.PI/2;a.position.y=.02;a.receiveShadow=true;spot.add(a);const r=new T.Mesh(new T.RingGeometry(.92,1.02,32),bmat(0xfff8e8));r.rotation.x=-Math.PI/2;r.position.y=.03;spot.add(r)})();
scene.add(spot);

/* ---------- football ---------- */
const ballMat=(function(){
  const p=(1+Math.sqrt(5))/2, P=[],H=[];
  [1,-1].forEach(a=>[1,-1].forEach(b=>{P.push([0,a,b*p],[a,b*p,0],[b*p,0,a])}));
  [1,-1].forEach(a=>[1,-1].forEach(b=>{[1,-1].forEach(c=>H.push([a,b,c]));H.push([0,a/p,b*p],[a/p,b*p,0],[b*p,0,a/p])}));
  const N=v=>{const l=Math.hypot(...v);return v.map(x=>x/l)}, Ps=P.map(N), Hs=H.map(N);
  const tex=canvasTex(512,256,(g,w,h)=>{const im=g.createImageData(w,h);let k=0;
    for(let y=0;y<h;y++){const th=(y+.5)/h*Math.PI,st=Math.sin(th),ct=Math.cos(th);for(let x=0;x<w;x++){const ph=(x+.5)/w*2*Math.PI,v=[st*Math.cos(ph),ct,st*Math.sin(ph)];let d1=9,d2=9,isP=false;
      const test=(c,wt,pp)=>{const d=Math.acos(clamp(v[0]*c[0]+v[1]*c[1]+v[2]*c[2],-1,1))*wt;if(d<d1){d2=d1;d1=d;isP=pp}else if(d<d2)d2=d};
      Ps.forEach(c=>test(c,1.2,true));Hs.forEach(c=>test(c,1,false));
      const seam=d2-d1<.02,c=seam?[120,128,140]:isP?[31,38,52]:[250,249,243];
      im.data[k++]=c[0];im.data[k++]=c[1];im.data[k++]=c[2];im.data[k++]=255}}
    g.putImageData(im,0,0)});
  return new T.MeshPhongMaterial({map:tex,shininess:45,specular:0x444444});
})();
const R=.3, ballGeo=new T.SphereGeometry(R,32,24);
const shadowTex=canvasTex(64,64,(g,w,h)=>{const a=g.createRadialGradient(32,32,2,32,32,32);a.addColorStop(0,'rgba(20,30,20,.55)');a.addColorStop(1,'rgba(20,30,20,0)');g.fillStyle=a;g.fillRect(0,0,w,h)});

/* ---------- particles ---------- */
const dot=canvasTex(32,32,(g,w,h)=>{const a=g.createRadialGradient(16,16,1,16,16,16);a.addColorStop(0,'#fff');a.addColorStop(.45,'rgba(255,255,255,.75)');a.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=a;g.fillRect(0,0,w,h)});
function Particles(n,size,blend){
  const pos=new Float32Array(n*3).fill(-999), col=new Float32Array(n*3).fill(1), g=new T.BufferGeometry();
  g.setAttribute('position',new T.BufferAttribute(pos,3));g.setAttribute('color',new T.BufferAttribute(col,3));
  const pts=new T.Points(g,new T.PointsMaterial({size,map:dot,transparent:true,depthWrite:false,vertexColors:true,blending:blend,sizeAttenuation:true}));
  pts.frustumCulled=false;scene.add(pts);
  const v=new Float32Array(n*3),life=new Float32Array(n),grav=new Float32Array(n);let i=0;
  return{emit(x,y,z,vx,vy,vz,l,c,gr){pos[i*3]=x;pos[i*3+1]=y;pos[i*3+2]=z;v[i*3]=vx;v[i*3+1]=vy;v[i*3+2]=vz;life[i]=l;grav[i]=gr==null?9:gr;col[i*3]=c[0];col[i*3+1]=c[1];col[i*3+2]=c[2];i=(i+1)%n},
    step(dt){for(let k=0;k<n;k++){if(life[k]<=0)continue;life[k]-=dt;if(life[k]<=0){pos[k*3+1]=-999;continue}v[k*3+1]-=grav[k]*dt;pos[k*3]+=v[k*3]*dt;pos[k*3+1]+=v[k*3+1]*dt;pos[k*3+2]+=v[k*3+2]*dt}g.attributes.position.needsUpdate=true;g.attributes.color.needsUpdate=true},
    clear(){life.fill(0);pos.fill(-999)}};
}
const spark=Particles(500,.26,T.AdditiveBlending), dust=Particles(260,.7,T.NormalBlending);

/* ---------- audio ---------- */
let ac=null,master,noiseBuf;
function initAudio(){if(ac){if(ac.state==='suspended')ac.resume();return}const C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=new C();const comp=ac.createDynamicsCompressor();comp.connect(ac.destination);master=ac.createGain();master.gain.value=.8;master.connect(comp);noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
function env(g,t,a,dec){g.gain.setValueAtTime(a,t);g.gain.exponentialRampToValueAtTime(.0008,t+dec)}
function noise(t,type,f,q,a,dec){const s=ac.createBufferSource();s.buffer=noiseBuf;s.loop=true;const b=ac.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;const g=ac.createGain();env(g,t,a,dec);s.connect(b);b.connect(g);g.connect(master);s.start(t,Math.random()*.8);s.stop(t+dec+.02)}
function tone(t,type,f0,f1,a,dec){const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dec);const g=ac.createGain();env(g,t,a,dec);o.connect(g);g.connect(master);o.start(t);o.stop(t+dec+.02)}
const can=()=>S.sound&&ac&&noiseBuf;
const sfx={
  kick(){if(!can())return;const t=ac.currentTime;tone(t,'sine',170,52,.9,.13);noise(t,'lowpass',1800,.6,.35,.05)},
  glass(){if(!can())return;const t=ac.currentTime,p=rnd(.92,1.1);
    noise(t,'highpass',2200*p,.7,1,.13);noise(t,'bandpass',4200*p,.9,.8,.3);tone(t,'sine',135,48,.75,.16);
    for(let i=0;i<30;i++){const q=Math.pow(Math.random(),1.8)*1.05;tone(t+.025+q,Math.random()<.5?'triangle':'sine',rnd(2600,8200),rnd(2400,7800),rnd(.06,.2)*(1-q*.6),rnd(.04,.12))}},
  tink(){if(!can())return;const t=ac.currentTime;tone(t,'triangle',rnd(3000,6500),rnd(2800,6000),.13,.08);tone(t+.05,'sine',rnd(4000,7500),4000,.08,.06)},
  thud(){if(!can())return;const t=ac.currentTime;tone(t,'sine',120,46,.8,.16);noise(t,'lowpass',620,.8,.5,.09)},
  clang(){if(!can())return;const t=ac.currentTime;tone(t,'square',760,740,.16,.2);tone(t,'triangle',1240,1190,.2,.3);noise(t,'bandpass',2100,2,.25,.05)},
  prop(k){if(!can())return;const t=ac.currentTime;
    if(k==='tv'){noise(t,'bandpass',900,1,.9,.16);tone(t,'sawtooth',900,60,.3,.22);for(let i=0;i<12;i++)noise(t+.03+i*.035,'highpass',5000,1,.32*(1-i/14),.018)}
    else if(k==='fish'){noise(t,'highpass',2600,.7,.65,.08);noise(t+.02,'lowpass',1300,1,.85,.55);for(let i=0;i<7;i++)tone(t+.1+i*.05,'sine',rnd(400,900),rnd(900,1500),.13,.06)}

  ballsLeft--;used++;drawBalls();sfx.kick();
  for(let i=0;i<14;i++)dust.emit(rnd(-.3,.3),.1,D+rnd(-.2,.2),rnd(-1.8,1.8),rnd(.6,2.2),rnd(-.5,1.5),rnd(.25,.5),[.72,.6,.42],3);
  addShake(.1);if(!hintDone){hintDone=true;updateHint()}
}
function flyLive(b,dt){
  b.sinkV+=S.gravity*dt;b.ty-=b.sinkV*dt;
  if(b.ty<R){b.ty=R;if(b.sinkV>0)b.sinkV=0}
  if(S.snap>0&&b.p.z<D*.6){let best=null,bd=1e9;panes.forEach(p=>{if(p.broken)return;const q=Math.hypot(b.tx-p.x,b.ty-p.y);if(q<Math.hypot(p.w,p.h)/2+1.3&&q<bd){bd=q;best=p}});
    if(best){const k=1-Math.exp(-S.snap*7*dt);b.tx+=(best.x-b.tx)*k;b.ty+=(best.y-b.ty)*k}}
  b.v.set(clamp((b.tx-b.p.x)*S.follow,-45,45),clamp((b.ty-b.p.y)*S.follow,-45,45),-S.flight*D/13);b.a.set(0,0,0);
  b.spin.set(0,1,0).cross(b.v).normalize();
}
function kick(s){
  const b=cur;cur=null;b.state='fly';b.v.copy(s.v0);b.a.copy(s.acc);b.spin.set(0,1,0).cross(b.v).normalize();b.age=0;balls.push(b);
  ballsLeft--;used++;drawBalls();sfx.kick();
  for(let i=0;i<14;i++)dust.emit(rnd(-.3,.3),.1,D+rnd(-.2,.2),rnd(-1.8,1.8),rnd(.6,2.2),rnd(-.5,1.5),rnd(.25,.5),[.72,.6,.42],3);
  addShake(.1);
  if(!hintDone){hintDone=true;updateHint()}
  later(.26,spawnBall);
}

/* ---------- juice ---------- */
let freezeT=0,slowT=0,shakeA=0,zoomK=0,focus=new T.Vector3(),focusK=0;
function addShake(a){shakeA=Math.min(1.1,shakeA+a*S.shake)}
function pop(text,x,y,z,small){const s=toScreen(x,y,z),d=document.createElement('div');d.className='pop'+(small?' small':'');d.textContent=text;d.style.left=clamp(s[0],90,W_-90)+'px';d.style.top=clamp(s[1],70,H_-50)+'px';$('stage').appendChild(d);setTimeout(()=>d.remove(),1000)}
function clipRect(poly,xa,xb,ya,yb){
  const cut=(pts,ins,inter)=>{const o=[];for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length],ia=ins(a),ib=ins(b);if(ia)o.push(a);if(ia!==ib)o.push(inter(a,b))}return o};
  const at=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
  let p=poly;
  p=cut(p,q=>q[0]>=xa,(a,b)=>at(a,b,(xa-a[0])/(b[0]-a[0])));if(p.length<3)return p;
  p=cut(p,q=>q[0]<=xb,(a,b)=>at(a,b,(xb-a[0])/(b[0]-a[0])));if(p.length<3)return p;
  p=cut(p,q=>q[1]>=ya,(a,b)=>at(a,b,(ya-a[1])/(b[1]-a[1])));if(p.length<3)return p;
  p=cut(p,q=>q[1]<=yb,(a,b)=>at(a,b,(yb-a[1])/(b[1]-a[1])));return p;
}
function shatter(p,hx,hy,ballSpeed){
  const lx=hx-p.x,ly=hy-p.y,xa=-p.w/2,xb=p.w/2,ya=-p.h/2,yb=p.h/2,rays=Math.round(17*S.shards),maxR=Math.hypot(p.w,p.h)*1.15;
  const ang=[];for(let i=0;i<rays;i++)ang.push((i+rnd(-.32,.32))/rays*Math.PI*2);
  const rs=[0,.2,.5,.92,1.5,maxR*1.5];
  const pt=(i,k,j)=>{const a=ang[(i+rays)%rays]+(i>=rays?Math.PI*2:0),r=rs[k]*(k?j[((i%rays)*7+k*3)%j.length]:0);return[lx+Math.cos(a)*r,ly+Math.sin(a)*r]};
  const jit=Array.from({length:31},()=>rnd(.82,1.18));
  const add=poly=>{
    const c=clipRect(poly,xa,xb,ya,yb);if(c.length<3)return;
    let cx=0,cy=0,ar=0;c.forEach((q,i)=>{const n=c[(i+1)%c.length];ar+=q[0]*n[1]-n[0]*q[1];cx+=q[0];cy+=q[1]});cx/=c.length;cy/=c.length;if(Math.abs(ar)<.0025)return;
    const edge=c.some(q=>Math.abs(q[0]-xa)<.001||Math.abs(q[0]-xb)<.001||Math.abs(q[1]-ya)<.001||Math.abs(q[1]-yb)<.001);
    const sh=new T.Shape();c.forEach((q,i)=>{const x=(q[0]-cx)*.94,y=(q[1]-cy)*.94;i?sh.lineTo(x,y):sh.moveTo(x,y)});
    const m=new T.Mesh(new T.ShapeGeometry(sh),shardMats[(Math.random()*3)|0]);m.position.set(p.x+cx,p.y+cy,0);m.renderOrder=4;scene.add(m);
    const dx=cx-lx,dy=cy-ly,d=Math.hypot(dx,dy)||.01,n=clamp(d/maxR,0,1),out=Math.random()<.42,rad=rnd(1,5.5)*(1.3-n);
    const v=new T.Vector3(dx/d*rad,dy/d*rad+rnd(0,2.5),out?rnd(2.5,10):-ballSpeed*rnd(.12,.38)*(1.1-n));
    const stuck=edge&&Math.random()<.38;
    shards.push({m,v,w:new T.Vector3(rnd(-16,16),rnd(-16,16),rnd(-16,16)),delay:stuck?rnd(.45,2.3):n*.14+rnd(0,.05),stuck,pane:p,rest:false,age:0,floor:out?.04:(p.room?p.room.floor+.04:.04)});
  };
  for(let i=0;i<rays;i++)for(let k=0;k<rs.length-1;k++){
    const a=pt(i,k,jit),b=pt(i+1,k,jit),c=pt(i+1,k+1,jit),e=pt(i,k+1,jit);
    if(k===0)add([a,c,e]);else if(k>2&&Math.random()<.6){if(Math.random()<.5){add([a,b,c]);add([a,c,e])}else{add([a,b,e]);add([b,c,e])}}else add([a,b,c,e]);
  }
  while(shards.length>700){const s=shards.shift();scene.remove(s.m);s.m.geometry.dispose()}
}
function ringAt(p){
  const m=new T.Mesh(new T.RingGeometry(.28,.31,48),new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.5,side:T.DoubleSide,depthWrite:false,blending:T.AdditiveBlending}));
  m.position.copy(p);m.position.z=.3;scene.add(m);fxObjs.push({m,t:0,d:.32});
}
const fxObjs=[];
function smash(p,b){
  p.broken=true;p.mesh.visible=false;
  const speed=b.v.length(),hx=clamp(b.p.x,p.x-p.w/2+.05,p.x+p.w/2-.05),hy=clamp(b.p.y,p.y-p.h/2+.05,p.y+p.h/2-.05);
  shatter(p,hx,hy,Math.max(speed,26));
  for(let i=0;i<90;i++)spark.emit(hx,hy,.15,rnd(-7,7),rnd(-5,8),rnd(-5,8),rnd(.2,.75),[.85,.95,1],8);
  ringAt(new T.Vector3(hx,hy,0));
  freezeT=S.freeze/1000;slowT=.26;addShake(.62);zoomK=1;focus.set(hx,hy,0);focusK=1;
  sfx.glass();
  pop(['SMASH!','CRASH!','KRAKK!','BOOM!'][(Math.random()*4)|0],hx,hy+.9,0);
  if(p.room){const dir=p.room.target.clone().sub(b.p).normalize();b.v.copy(dir).multiplyScalar(Math.max(13,speed*.6));b.a.set(0,0,0);b.state='inside';b.pane=p}
  else{b.v.multiplyScalar(.72);b.a.x=0;b.state='passed'}
  checkWin();
}
function propSmash(p,b){
  const r=p.room;r.hit=true;r.group.visible=false;
  const c=r.target;
  for(let i=0;i<48;i++){const col=r.colors[i%r.colors.length],m=new T.Mesh(sharedDebris,bmat(col));const s=rnd(.08,.3);m.scale.set(s,rnd(.05,.25),s);m.position.copy(c).add(new T.Vector3(rnd(-.45,.45),rnd(-.45,.45),rnd(-.3,.3)));scene.add(m);
    debris.push({m,v:new T.Vector3(rnd(-6,6),rnd(1,8),rnd(-3.5,5)),w:new T.Vector3(rnd(-14,14),rnd(-14,14),rnd(-14,14)),floor:r.floor+.08,zMin:-5.1,zMax:-.35,xMin:p.x-p.w/2-1.1,xMax:p.x+p.w/2+1.1,age:0,rest:false})}
  if(r.kind==='fish')for(let i=0;i<90;i++)spark.emit(c.x,c.y,c.z,rnd(-6,6),rnd(0,9),rnd(-2,6),rnd(.4,.9),[.3,.65,1],14);
  if(r.kind==='tv')for(let i=0;i<60;i++)spark.emit(c.x,c.y,c.z+.2,rnd(-7,7),rnd(0,8),rnd(-1,6),rnd(.2,.55),[1,.8,.3],12);
  addShake(.32);sfx.prop(r.kind);pop(r.word,p.x,p.y+.2,0,true);
  b.state='dead';b.v.set(-b.v.x*.15,1.8,-b.v.z*.2+1);b.a.set(0,-G,0);b.floor=r.floor+R;b.age=0;
}
const sharedDebris=new T.BoxGeometry(1,1,1);
function checkWin(){
  if(won||panes.some(p=>!p.broken))return;won=true;$('hint').hidden=true;
  if(drag){drag=null;hidePreview()}
  const house=LVL.type==='house';
  if(house)later(.75,()=>{grumpT=0;grump.visible=true;sfx.hey();$('bubble').hidden=false});
  later(house?2.1:1.15,showCard);
}
function showCard(){
  const n=panes.length,st=used<=n?3:used===n+1?2:1;
  $('cardTitle').textContent=st===3?'Perfect smash!':'Smashed!';
  $('stars').innerHTML='<b>'+'★'.repeat(st)+'</b>'+'★'.repeat(3-st);
  $('cardText').textContent=n+(n>1?' windows':' window')+' with '+used+(used>1?' balls':' ball');
  $('next').textContent=level===LV.length-1?'Play again':'Next';
  $('card').hidden=false;
}
let failing=false,spawnWait=0;
function checkFail(){
  if(won||failing||ballsLeft>0||cur)return;
  if(balls.some(b=>b.state==='fly'||b.state==='inside'))return;
  if(!panes.some(p=>!p.broken))return;
  failing=true;const t=$('toast');t.textContent='Out of balls';t.hidden=false;
  later(.95,()=>{failing=false;loadLevel(level)});
}

/* ---------- ball step ---------- */
function wallHit(b,kind){
  b.p.z=ZF+R*.5;b.v.z*=-.42;b.v.x*=.55;b.v.y*=.55;b.a.x=0;b.state='bounce';b.age=Math.min(b.age,.3);
  for(let i=0;i<20;i++)dust.emit(b.p.x,b.p.y,.3,rnd(-2.2,2.2),rnd(-1,2.4),rnd(0,2.2),rnd(.25,.55),[.92,.76,.56],2);
  addShake(.16);if(kind==='clang')sfx.clang();else sfx.thud();
  if(Math.random()<.5)pop(kind==='clang'?'CLANG':'BONK',b.p.x,b.p.y+.5,0,true);
}
function crossPlane(b){
  if(b.live){b.live=false;b.a.set(0,-G,0)}
  const x=b.p.x,y=b.p.y;
  for(const p of panes){if(Math.abs(x-p.x)<=p.w/2+.06&&Math.abs(y-p.y)<=p.h/2+.06){
    if(!p.broken){smash(p,b);return}
    if(p.room){b.state='dead';b.a.set(0,-G,0);b.floor=p.room.floor+R;b.pane=p;b.age=0}else b.state='passed';
    return}}
  if(LVL.type==='stand'){const p=panes[0],f=.3;
    if(Math.abs(x-p.x)<=p.w/2+f&&Math.abs(y-p.y)<=p.h/2+f){wallHit(b,'clang');return}
    if(Math.abs(Math.abs(x-p.x)-(p.w/2+.1))<.26&&y<p.y){wallHit(b,'clang');return}
    return}
  const W=LVL.W,H=LVL.H,Gb=LVL.G,top=Math.abs(x)<=W?H+Gb*(1-Math.abs(x)/W):-1;
  if(Math.abs(x)<=W&&y<=top+.1)wallHit(b,'thud');
}
function stepBall(b,dt){
  b.age+=dt;if(b.live&&b.state==='fly')flyLive(b,dt);const sub=4,h=dt/sub;
  for(let i=0;i<sub;i++){
    const z0=b.p.z;b.v.addScaledVector(b.a,h);b.p.addScaledVector(b.v,h);
    if(b.state==='fly'&&z0>ZF&&b.p.z<=ZF){crossPlane(b);if(b.state==='fly'){b.state='passed'}}
    if(b.state==='inside'&&b.pane&&!b.pane.room.hit&&b.p.distanceTo(b.pane.room.target)<.62){propSmash(b.pane,b)}
    const fl=b.floor!==undefined?b.floor:R;
    if(b.p.y<fl){b.p.y=fl;if(b.v.y<0){if(b.v.y<-3&&b.state!=='dead'&&!b.live)sfx.thud();b.v.y*=-.48}b.v.x*=.88;b.v.z*=.88}
    if(b.state==='dead'&&b.pane){b.p.z=clamp(b.p.z,-5.2,-.4)}
  }
  const sp=b.v.length();if(sp>.05)b.m.rotateOnWorldAxis(b.spin,sp/R*dt*.75);
  b.sh.position.x=b.p.x;b.sh.position.z=b.p.z;b.sh.material.opacity=clamp(1-b.p.y/9,.15,1);b.sh.visible=b.state!=='inside'&&b.state!=='dead';
  if(b.state==='fly'&&Math.random()<.9)spark.emit(b.p.x,b.p.y,b.p.z,0,0,0,b.live?.42:.2,b.live?[.8,.8,.8]:[.55,.55,.55],0);
  const done=b.age>(b.state==='fly'?3:b.state==='inside'?1.6:2.2)||b.p.z<-16;
  if(done){if(b.state==='fly')b.state='gone';removeBallMesh(b);return false}
  return true;
}

/* ---------- main loop ---------- */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const real=Math.min(.05,(now-last)/1000);last=now;
  let dt=real;
  if(freezeT>0){freezeT-=real;dt=0}
  else if(slowT>0){slowT-=real;dt=real*S.slow}
  tick(dt,real);
  renderer.render(scene,camera);
  drawTrail();
}
function tick(dt,real){
  for(let i=timers.length-1;i>=0;i--){timers[i].t-=real;if(timers[i].t<=0){const f=timers[i].f;timers.splice(i,1);f()}}
  if(S.mode==='live'&&!cur&&!won&&ballsLeft>0&&!balls.some(b=>b.state==='fly')){spawnWait+=real;if(spawnWait>.22){spawnWait=0;spawnBall()}}else spawnWait=0;
  if(cur){cur.born+=real;const s=clamp(cur.born/.14,0,1);cur.m.scale.setScalar(s<1?s*(1.25-.25*s):1);cur.p.y=R+(1-s)*.5}
  for(let i=balls.length-1;i>=0;i--)if(!stepBall(balls[i],dt))balls.splice(i,1);
  for(let i=shards.length-1;i>=0;i--){const s=shards[i];if(s.rest)continue;
    if(s.delay>0){s.delay-=dt;if(s.stuck&&s.delay<.2)s.m.rotation.z=Math.sin(s.delay*70)*.03;if(s.delay<=0&&s.stuck){sfx.tink();s.v.set(rnd(-.6,.6),-.5,rnd(.2,2));}continue}
    s.age+=dt;s.v.y-=23*dt;s.m.position.addScaledVector(s.v,dt);s.m.rotation.x+=s.w.x*dt;s.m.rotation.y+=s.w.y*dt;s.m.rotation.z+=s.w.z*dt;
    if(s.m.position.y<s.floor){
      s.m.position.y=s.floor;
      if(s.v.y<-3.5&&s.w.lengthSq()>4){s.v.y*=-.26;s.v.x*=.5;s.v.z*=.5;s.w.multiplyScalar(.4);if(Math.random()<.05)sfx.tink()}
      else{s.rest=true;s.m.rotation.set(-Math.PI/2+rnd(-.04,.04),rnd(-.04,.04),rnd(0,6.28));s.m.position.y=s.floor+rnd(0,.02)}
    }
  }
  for(let i=debris.length-1;i>=0;i--){const d=debris[i];if(d.rest)continue;d.v.y-=22*dt;d.m.position.addScaledVector(d.v,dt);d.m.rotation.x+=d.w.x*dt;d.m.rotation.y+=d.w.y*dt;
    const q=d.m.position;if(q.z<d.zMin){q.z=d.zMin;d.v.z*=-.4}if(q.z>d.zMax){q.z=d.zMax;d.v.z*=-.4}if(q.x<d.xMin){q.x=d.xMin;d.v.x*=-.4}if(q.x>d.xMax){q.x=d.xMax;d.v.x*=-.4}
    if(q.y<d.floor){q.y=d.floor;if(d.v.y<-2.5){d.v.y*=-.32;d.v.x*=.6;d.v.z*=.6}else d.rest=true}}
  for(let i=fxObjs.length-1;i>=0;i--){const f=fxObjs[i];f.t+=real;const k=f.t/f.d;if(k>=1){scene.remove(f.m);f.m.geometry.dispose();f.m.material.dispose();fxObjs.splice(i,1);continue}f.m.scale.setScalar(1+k*8);f.m.material.opacity=.5*(1-k)}
  spark.step(dt);dust.step(dt);
  clouds.forEach(c=>{c.position.x+=c.userData.s*real;if(c.position.x>110)c.position.x=-110});
  if(grumpT>=0){grumpT+=real;const k=clamp(grumpT/.28,0,1),e=1-Math.pow(1-k,3);door.rotation.y=-1.75*e;grump.position.z=lerp(-.6,1.1,e);grump.rotation.z=Math.sin(grumpT*22)*.05;grump.userData.arm.rotation.z=-.25+Math.sin(grumpT*28)*.38;
    const s=toScreen(0,3.5,1.1),bb=$('bubble');bb.style.left=s[0]+'px';bb.style.top=s[1]+'px'}
  shakeA=Math.max(0,shakeA-real*2.6);zoomK=Math.max(0,zoomK-real*3.2);focusK=Math.max(0,focusK-real*1.5);
  const sx=(Math.random()-.5)*shakeA*.75,sy=(Math.random()-.5)*shakeA*.75,fk=focusK*focusK;
  camera.position.set(camBase.x+sx+focus.x*fk*.1,camBase.y+sy+focus.y*fk*.03,camBase.z-fk*1.5);
  const lx=lerp(camLook.x,focus.x,fk*.2),ly=lerp(camLook.y,focus.y,fk*.12);
  camera.lookAt(lx,ly,0);
  camera.zoom=1+zoomK*zoomK*.07;camera.updateProjectionMatrix();
  checkFail();
}
function drawTrail(){
  fctx.clearRect(0,0,W_,H_);if(!drag||drag.pts.length<2)return;
  const p=drag.pts;fctx.lineCap='round';fctx.lineJoin='round';
  for(let i=1;i<p.length;i++){const k=i/p.length;fctx.strokeStyle='rgba(255,255,255,'+(.2+.65*k)+')';fctx.lineWidth=3+9*k;fctx.beginPath();fctx.moveTo(p[i-1].x,p[i-1].y);fctx.lineTo(p[i].x,p[i].y);fctx.stroke()}
}

/* ---------- UI ---------- */
function chips(){
  document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===S.mode));
  document.querySelectorAll('[data-lvl]').forEach(b=>b.classList.toggle('on',+b.dataset.lvl===level));
  $('sound').textContent=S.sound?'Sound on':'Sound off';
}
function buildSliders(){
  const vis=SL.filter(a=>!a[5]||a[5]===(S.mode==='live'?'live':'old'));
  $('sliders').innerHTML=vis.map(a=>'<label for="s_'+a[0]+'"><span>'+a[1]+'</span><output id="o_'+a[0]+'"></output><input id="s_'+a[0]+'" type="range" min="'+a[2]+'" max="'+a[3]+'" step="'+a[4]+'"></label>').join('');
  vis.forEach(a=>{const i=$('s_'+a[0]),o=$('o_'+a[0]);i.value=S[a[0]];o.textContent=S[a[0]];i.oninput=()=>{S[a[0]]=+i.value;o.textContent=i.value;save()}});
}
$('gear').onclick=()=>{$('panel').hidden=!$('panel').hidden};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;save();buildSliders();chips()});
document.querySelectorAll('[data-lvl]').forEach(b=>b.onclick=()=>{failing=false;loadLevel(+b.dataset.lvl)});
$('sound').onclick=()=>{initAudio();S.sound=!S.sound;save();chips()};
$('reset').onclick=()=>{S=Object.assign({},DEF);save();buildSliders();chips()};
$('copy').onclick=()=>{const txt=JSON.stringify(S),box=$('copyBox');const fb=()=>{box.hidden=false;box.value=txt;box.select()};$('copy').textContent='Copied';setTimeout(()=>$('copy').textContent='Copy values',1100);try{navigator.clipboard.writeText(txt).catch(fb)}catch(e){fb()}};
$('next').onclick=()=>{initAudio();loadLevel(level+1)};
addEventListener('keydown',e=>{if(e.key==='m'||e.key==='M'){const o=['live','aim','shape'];S.mode=o[(o.indexOf(S.mode)+1)%3];save();buildSliders();failing=false;loadLevel(level);pop('Control: '+S.mode,0,4,0,true)}else if(e.key==='r'||e.key==='R'){failing=false;loadLevel(level)}else if((e.key===' '||e.key==='Enter')&&!$('card').hidden){e.preventDefault();loadLevel(level+1)}});
addEventListener('resize',layout);

buildSliders();
layout();
loadLevel(0);
requestAnimationFrame(frame);
window.__ws={get panes(){return panes},get level(){return level},get won(){return won},get ballsLeft(){return ballsLeft},get cur(){return !!cur},get balls(){return balls},ballPx,scr:toScreen,S};
})();
